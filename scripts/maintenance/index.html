<!doctype html>
<html lang="ka">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#283DEE">
<title>ტაო დაზღვევა</title>
<link rel="icon" href="/favicon.ico">
<!-- Shown by Caddy to visitors until the new site launches (see DEPLOY.md, "Maintenance page"):
     the site's first-view loader (the white handwritten ტ on TAO blue), looping.
     Files next to it on the server: /maintenance/lottie_svg.min.js (lottie-web) and /maintenance/tao-loader-symbol.json. -->
<style>
html, body { margin: 0; height: 100%; background: #283DEE; overflow: hidden; }
#anim { position: absolute; inset: 0; }
@media (max-width: 599px) { #anim { top: 0; bottom: 0; left: 50%; right: auto; width: 140vw; transform: translateX(-50%); } }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
</style>
</head>
<body>
<h1 class="sr">ტაო დაზღვევა: ვებგვერდი ახლდება</h1>
<div id="anim" aria-hidden="true"></div>
<script src="/maintenance/lottie_svg.min.js"></script>
<script>
(function () {
  var box = document.getElementById('anim')
  var still = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches
  var anim = lottie.loadAnimation({
    container: box,
    renderer: 'svg',
    loop: !still,
    autoplay: !still,
    path: '/maintenance/tao-loader-symbol.json',
    rendererSettings: { preserveAspectRatio: window.innerWidth < 600 ? 'xMidYMid meet' : 'xMidYMid slice' },
  })
  // reduced motion: show the finished ტ instead of the drawing loop
  if (still) anim.addEventListener('DOMLoaded', function () { anim.goToAndStop(anim.totalFrames - 1, true) })
})()
</script>
</body>
</html>
